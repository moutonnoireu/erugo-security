name: Release

# Push a tag such as v0.2.15-sec.1, or create the release from the GitHub UI:
# the release notes come from the matching CHANGELOG.md section. The image itself is built and published by
# docker.yml for the same tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Section "## [VERSION]" up to the next "## [" heading
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          cat >> notes.md <<EOF

          ## Image

          \`\`\`
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/erugo-security:${VERSION}
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist if it was created from the GitHub UI
          # (which creates the tag at the same time): fill in its notes then.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
