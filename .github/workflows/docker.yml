name: Build and publish image

on:
  push:
    branches: [php-fix]
    tags: ["v*"]
  schedule:
    # Weekly rebuild of the latest release, to pick up Alpine/PHP security fixes
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/erugo-security

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      v: ${{ steps.ver.outputs.v }}
      tags: ${{ steps.ver.outputs.tags }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # What to build and how to tag it:
      #   push to php-fix          -> :edge, :sha-<commit>
      #   tag vX.Y.Z-sec.N         -> :X.Y.Z-sec.N, :X.Y.Z, :latest
      #   weekly / manual rebuild  -> the latest release tag, same tags as a release
      - name: Resolve version and tags
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG=""
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          fi

          if [ -n "$TAG" ]; then
            git checkout -q "$TAG"
            VERSION="${TAG#v}"
            UPSTREAM="${VERSION%%-*}"
            TAGS="${IMAGE}:${VERSION}
          ${IMAGE}:${UPSTREAM}
          ${IMAGE}:latest"
          else
            SHORT=$(git rev-parse --short HEAD)
            VERSION="$(sed 's/^v//' .upstream-version | tr -d '\n')-edge+${SHORT}"
            TAGS="${IMAGE}:edge
          ${IMAGE}:sha-${SHORT}"
          fi

          echo "Building ${VERSION} from ${TAG:-$GITHUB_SHA}"
          echo "v=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$TAGS" | sed 's/^ *//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # One native runner per architecture (no QEMU emulation): each image is
  # scanned, then pushed by digest; the merge job tags the multi-arch index.
  build:
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (${{ matrix.arch }}) for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Scheduled/manual rebuilds without cache, otherwise cached layers are
          # reused and new PHP/Alpine packages are never picked up.
          no-cache: ${{ github.event_name != 'push' }}
          load: true
          tags: erugo-scan:ci
          build-args: VERSION=${{ needs.resolve.outputs.v }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test (PHP version and extensions)
        run: |
          docker run --rm --entrypoint php erugo-scan:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-scan:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" \
              || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erugo-scan:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Report Trivy findings
        run: |
          # One annotation per finding, so failures are readable from the run summary
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "::error title=\(.VulnerabilityID) (\(.Severity))::\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) in \($t)"' trivy.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "Fixable CRITICAL vulnerabilities: $COUNT"
          [ "$COUNT" -eq 0 ]
      - name: Push by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # same builder: the layers come from the scanned build above
          build-args: VERSION=${{ needs.resolve.outputs.v }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # SBOM (SPDX) and SLSA provenance attached to the image as attestations
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.v }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.ref }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # keyless signing with cosign (Sigstore): the workflow's OIDC identity
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        id: index
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS -t $t"; done
          SOURCES=$(cd digests && for d in *; do printf '%s@sha256:%s ' "$IMAGE" "$d"; done)
          docker buildx imagetools create $ARGS $SOURCES
          FIRST=$(echo "$TAGS" | head -1)
          docker buildx imagetools inspect "$FIRST"
          DIGEST=$(docker buildx imagetools inspect "$FIRST" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          # signs the multi-arch index and each platform image; the signature,
          # its certificate and a transparency log entry are public (Rekor)
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/docker\.yml@" \
            > /dev/null
          echo "Signed: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
