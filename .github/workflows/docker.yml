name: Build and publish image

on:
  push:
    branches: [php-fix]
    tags: ["v*"]
  schedule:
    # Weekly rebuild of the latest release, to pick up Alpine/PHP security fixes
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/erugo-security

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What to build and how to tag it:
      #   push to php-fix          -> :edge, :sha-<commit>
      #   tag vX.Y.Z-sec.N         -> :X.Y.Z-sec.N, :X.Y.Z, :latest
      #   weekly / manual rebuild  -> the latest release tag, same tags as a release
      - name: Resolve version and tags
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG=""
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          fi

          if [ -n "$TAG" ]; then
            git checkout -q "$TAG"
            VERSION="${TAG#v}"
            UPSTREAM="${VERSION%%-*}"
            TAGS="${IMAGE}:${VERSION}
          ${IMAGE}:${UPSTREAM}
          ${IMAGE}:latest"
          else
            SHORT=$(git rev-parse --short HEAD)
            VERSION="$(sed 's/^v//' .upstream-version | tr -d '\n')-edge+${SHORT}"
            TAGS="${IMAGE}:edge
          ${IMAGE}:sha-${SHORT}"
          fi

          echo "Building ${VERSION}"
          echo "v=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$TAGS" | sed 's/^ *//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (amd64) for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          # Scheduled/manual rebuilds without cache, otherwise the cached `apk add`
          # layer is reused and new PHP/Alpine packages are never picked up.
          no-cache: ${{ github.event_name != 'push' }}
          load: true
          tags: erugo-scan:ci
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (PHP version and extensions)
        run: |
          docker run --rm --entrypoint php erugo-scan:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-scan:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" \
              || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erugo-scan:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Report Trivy findings
        run: |
          # One annotation per finding, so failures are readable from the run summary
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "::error title=\(.VulnerabilityID) (\(.Severity))::\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) in \($t)"' trivy.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "Fixable CRITICAL vulnerabilities: $COUNT"
          [ "$COUNT" -eq 0 ]
      - name: Publish multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          push: true
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.revision=${{ github.sha }}
