name: Build and publish image

on:
  push:
    branches: [php-fix]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/erugo-security

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: php-fix
      - id: ver
        run: echo "v=$(sed 's/^v//' .upstream-version | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (amd64) for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          # Rebuild planifié ou manuel : sans cache, sinon la couche `apk add`
          # est réutilisée et les nouveaux paquets php83 ne sont jamais récupérés.
          no-cache: ${{ github.event_name != 'push' }}
          load: true
          tags: erugo-scan:ci
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (PHP version and extensions)
        run: |
          docker run --rm --entrypoint php erugo-scan:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-scan:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl; do
            echo "$MODULES" | grep -qix "$ext" \
              || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erugo-scan:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          push: true
          build-args: VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}
