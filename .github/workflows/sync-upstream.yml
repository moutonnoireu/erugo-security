name: Sync upstream release

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: php-fix
          fetch-depth: 0
      - name: Merge latest upstream tag into a PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/ErugoOSS/Erugo.git
          git fetch upstream --tags --no-recurse-submodules
          # Upstream tags only: the fork's own v*-sec.* tags must not count.
          # Name and SHA come from the same ls-remote output; the SHA is what gets merged.
          line=$(git ls-remote --tags --refs upstream 'refs/tags/v*' \
            | sed -n 's|^\([0-9a-f]\{40,\}\)[[:space:]]*refs/tags/\(v[0-9][^/]*\)$|\2 \1|p' \
            | sort -V | tail -1)
          latest=${line% *}
          sha=${line#* }
          [[ "$latest" =~ ^v[0-9] && -n "$sha" ]] || { echo "::error::no valid upstream tag found"; exit 1; }
          current=$(cat .upstream-version)
          [ "$latest" = "$current" ] && { echo "up to date ($current)"; exit 0; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -n "$(gh pr list --head "sync/$latest" --state open --json number -q '.[].number')" ]; then
            echo "PR for sync/$latest already open, nothing to do"; exit 0
          fi
          git checkout -b "sync/$latest"
          git merge --no-edit "$sha"
          echo "$latest" > .upstream-version
          git commit -am "Upstream $latest"
          # Stale branch without open PR: overwrite it, never skip silently.
          git push --force -u origin "sync/$latest"
          gh pr create --base php-fix --head "sync/$latest" \
            --title "Upstream $latest" \
            --body "Merge upstream tag $latest. Check migrations before deploying."
