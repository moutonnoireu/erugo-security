name: Tests

on:
  pull_request:
  push:
    branches: [php-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is what the image ships; 8.3 is the lowest version tested for people building their own
        php: ["8.3", "8.5"]
    name: phpunit (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, intl, zip, mbstring, bcmath, curl, openssl, fileinfo, sodium
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fail on known vulnerabilities in PHP dependencies (Dependabot cannot fix
      # those held back by another package's constraint)
      - name: Composer audit
        if: matrix.php == '8.5'
        run: |
          composer audit --locked --format=json > audit.json || true
          jq -r '.advisories // {} | to_entries[] | .key as $pkg | .value[] |
            "::error title=\($pkg) \(.cve // .advisoryId)::\(.title) (affected: \(.affectedVersions))"' audit.json
          [ "$(jq '[.advisories // {} | to_entries[] | .value[]] | length' audit.json)" -eq 0 ]

      # Tests run against an in-memory SQLite database (see phpunit.xml)
      - name: PHPUnit
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npx vite build

  # Build the image from the PR (no push) so Dockerfile changes are checked before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: erugo-pr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run --rm --entrypoint php erugo-pr:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-pr:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Boot the container
        run: |
          # same layout as the reference compose file: storage is a volume
          docker run -d --name erugo -p 8080:80 -v erugo-storage:/var/www/html/storage erugo-pr:ci
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              curl -fsS http://localhost:8080/api/health; echo
              curl -fsS -o /dev/null -w "home page: %{http_code}\n" http://localhost:8080/
              exit 0
            fi
            sleep 2
          done
          LOGS=$(docker logs erugo 2>&1 | tail -n 60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erugo did not answer on /api/health::$LOGS"
          docker exec erugo sh -c 'tail -n 40 /var/log/supervisor/*.log 2>/dev/null; tail -n 40 /var/www/html/storage/logs/*.log 2>/dev/null' || true
          exit 1
      - name: End-to-end sign-in flows (2FA, passkeys)
        run: |
          # test account and settings inside the running container
          docker exec -u erugo erugo php /var/www/html/artisan tinker --execute='
            $u = new App\Models\User; $u->name = "E2E"; $u->email = "e2e@example.com";
            $u->password = bcrypt("E2e-Password-123!"); $u->admin = true; $u->active = true;
            $u->must_change_password = false; $u->save();
            App\Models\Setting::where("key", "passkey_login_enabled")->update(["value" => "true"]);
            app(App\Services\SettingsService::class)->clearCache();'
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          mkdir -p e2e-screenshots
          BASE_URL=http://localhost:8080 EMAIL=e2e@example.com PASSWORD='E2e-Password-123!' \
            SCREENSHOTS_DIR=e2e-screenshots node tests/e2e/auth-flows.mjs
      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
