name: Tests

on:
  pull_request:
  push:
    branches: [php-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is what the image ships; 8.3 is the lowest version tested for people building their own
        php: ["8.3", "8.5"]
    name: phpunit (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, intl, zip, mbstring, bcmath, curl, openssl, fileinfo, sodium
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fail on known vulnerabilities in PHP dependencies (Dependabot cannot fix
      # those held back by another package's constraint)
      - name: Composer audit
        if: matrix.php == '8.5'
        run: |
          composer audit --locked --format=json > audit.json || true
          jq -r '.advisories // {} | to_entries[] | .key as $pkg | .value[] |
            "::error title=\($pkg) \(.cve // .advisoryId)::\(.title) (affected: \(.affectedVersions))"' audit.json
          [ "$(jq '[.advisories // {} | to_entries[] | .value[]] | length' audit.json)" -eq 0 ]

      # Tests run against an in-memory SQLite database (see phpunit.xml)
      - name: PHPUnit
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npx vite build

  # Build the image from the PR (no push) so Dockerfile changes are checked before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: erugo-pr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run --rm --entrypoint php erugo-pr:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-pr:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erugo-pr:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Report Trivy findings
        run: |
          # One annotation per finding, so failures are readable from the run summary
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "::error title=\(.VulnerabilityID) (\(.Severity))::\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) in \($t)"' trivy.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "Fixable CRITICAL vulnerabilities: $COUNT"
          [ "$COUNT" -eq 0 ]
      - name: Boot with the default settings (existing deployments)
        run: |
          # same layout as the reference compose file: started as root, port 80, storage volume
          docker run -d --name erugo-default -p 8081:80 -v erugo-storage:/var/www/html/storage erugo-pr:ci
          ./.github/scripts/wait-healthy.sh erugo-default http://localhost:8081
          # root is only used to fix the volume ownership: every process runs as erugo (uid 1000)
          PROCS=$(docker top erugo-default -eo uid,pid,args 2>&1) || { echo "::error::docker top failed: $PROCS"; exit 1; }
          echo "$PROCS"
          OTHERS=$(echo "$PROCS" | tail -n +2 | awk '$1 != "1000"')
          if [ -n "$OTHERS" ]; then
            echo "::error title=Processes not running as erugo::$(echo "$OTHERS" | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1
          fi
          docker rm -f erugo-default
      - name: Boot hardened (read-only, no capabilities, non-root from the start)
        run: |
          # reuses the volume initialised above, as an upgrade would
          docker run -d --name erugo -p 8080:8080 -e ERUGO_PORT=8080 \
            --user 1000:1000 --read-only --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v erugo-storage:/var/www/html/storage erugo-pr:ci
          ./.github/scripts/wait-healthy.sh erugo http://localhost:8080
      - name: End-to-end flows (headers, 2FA, passkeys, upload/download)
        run: |
          # test account and settings inside the running container
          docker exec -u erugo -e HOME=/tmp erugo php /var/www/html/artisan tinker --execute='
            $u = new App\Models\User; $u->name = "E2E"; $u->email = "e2e@example.com";
            $u->password = bcrypt("E2e-Password-123!"); $u->admin = true; $u->active = true;
            $u->must_change_password = false; $u->save();
            App\Models\Setting::where("key", "passkey_login_enabled")->update(["value" => "true"]);
            app(App\Services\SettingsService::class)->clearCache();'
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          mkdir -p e2e-screenshots
          BASE_URL=http://localhost:8080 EMAIL=e2e@example.com PASSWORD='E2e-Password-123!' \
            SCREENSHOTS_DIR=e2e-screenshots node tests/e2e/auth-flows.mjs
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs erugo 2>&1 | tail -n 200 || true
          docker exec erugo sh -c 'tail -n 50 /var/www/html/storage/logs/*.log' 2>/dev/null || true
      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
