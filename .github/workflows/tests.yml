name: Tests

on:
  pull_request:
  push:
    branches: [php-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is what the image ships; 8.3 is the lowest version tested for people building their own
        php: ["8.3", "8.5"]
    name: phpunit (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, intl, zip, mbstring, bcmath, curl, openssl, fileinfo, sodium
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Tests run against an in-memory SQLite database (see phpunit.xml)
      - name: PHPUnit
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx vite build

  # Build the image from the PR (no push) so Dockerfile changes are checked before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: erugo-pr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run --rm --entrypoint php erugo-pr:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-pr:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
      - name: Boot the container
        run: |
          docker run -d --name erugo -p 8080:80 erugo-pr:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              curl -fsS http://localhost:8080/api/health; echo
              curl -fsS -o /dev/null -w "home page: %{http_code}\n" http://localhost:8080/
              exit 0
            fi
            sleep 2
          done
          echo "::error::Erugo did not answer on /api/health"
          docker logs erugo | tail -n 80
          exit 1
