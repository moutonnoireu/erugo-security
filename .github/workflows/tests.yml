name: Tests

on:
  pull_request:
  push:
    branches: [php-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, gd, intl, zip, mbstring, bcmath, curl, openssl, fileinfo, sodium
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Tests run against an in-memory SQLite database (see phpunit.xml)
      - name: PHPUnit
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx vite build

  # Build the image from the PR (no push) so Dockerfile changes are checked before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: erugo-pr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run --rm --entrypoint php erugo-pr:ci -v
          MODULES=$(docker run --rm --entrypoint php erugo-pr:ci -m)
          for ext in pdo_sqlite pdo_mysql pdo_pgsql gd intl zip mbstring curl openssl sodium; do
            echo "$MODULES" | grep -qix "$ext" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done
