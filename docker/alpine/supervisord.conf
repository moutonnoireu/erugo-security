; Every program runs as the unprivileged erugo user: start-container drops
; root (if it has it) before starting supervisord. Output (stdout and stderr)
; goes to the container log.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:frankenphp]
command=/usr/local/bin/frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autostart=true
autorestart=true
priority=5

[program:tusd]
command=/usr/local/bin/tusd -host 127.0.0.1 -port 1080 -behind-proxy -hooks-http http://127.0.0.1:1081/api/tusd-hooks -upload-dir /var/www/html/storage/app/uploads -base-path /files/
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autostart=true
autorestart=true
priority=15

[program:eurgo-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

; Laravel scheduler (replaces cron, which needs root)
[program:eurgo-scheduler]
command=php /var/www/html/artisan schedule:work --quiet
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
